name: no-build build
on: [push, pull_request]

jobs:
  cli:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone GIT repo
        uses: actions/checkout@v4
      - name: Build and smoke-test Homebrew CLI
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror \
            -DNOB_VERSION='"development"' \
            -DNOB_INSTALLED_HEADER='"nob.h"' \
            -o build/nob-cli cli/nob.c
          ./build/nob-cli --version
          ./build/nob-cli list
  macos:
    strategy:
      matrix:
        lang: [c, c++]
    runs-on: macos-latest
    steps:
      - name: Clone GIT repo
        uses: actions/checkout@v4
      - name: Run tests
        run: |
          clang -x ${{ matrix.lang }} -o nob nob.c
          ./nob
      - name: Build how_to-s
        run: |
          cd how_to/
          clang -x ${{ matrix.lang }} -o nob nob.c
          ./nob
  ubuntu:
    strategy:
      matrix:
        cc: [gcc, clang]
        lang: [c, c++]
    runs-on: ubuntu-latest
    steps:
      - name: Clone GIT repo
        uses: actions/checkout@v4
      - name: Build tests
        run: |
          ${{ matrix.cc }} -x ${{ matrix.lang }} -o nob nob.c
          ./nob
      - name: Build how_to-s
        run: |
          cd how_to/
          ${{ matrix.cc }} -x ${{ matrix.lang }} -o nob nob.c
          ./nob
  windows:
    strategy:
      matrix:
        mode: ["/TC", "/std:c++20 /TP"]
    runs-on: windows-latest
    steps:
      - name: Clone GIT repo
        uses: actions/checkout@v4
      - name: vswhere
        run: vswhere
      - name: Build tests
        shell: cmd
        # cl.exe isn't available as-is in Github images because they don't want
        # to, so we need to pull env vars ourselves. Refs:
        # https://github.com/actions/runner-images/issues/6205#issuecomment-1241573412
        # https://learn.microsoft.com/en-us/cpp/build/building-on-the-command-line?view=msvc-170#create-your-own-command-prompt-shortcut
        run: |
          call "C:\\Program Files\\Microsoft Visual Studio\\18\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat"
          cl.exe ${{ matrix.mode }} /Fe:nob nob.c
          nob.exe
      - name: Build how_to-s
        shell: cmd
        run: |
          call "C:\\Program Files\\Microsoft Visual Studio\\18\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat"
          cd how_to/
          cl.exe ${{ matrix.mode }} /Fe:nob nob.c
          nob.exe
